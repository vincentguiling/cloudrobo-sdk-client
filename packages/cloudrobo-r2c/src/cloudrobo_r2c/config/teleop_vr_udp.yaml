# ── 遥操操作端配置：VR（UDP 姿态流，双臂末端位姿） ────────────────────────
# VR 桥接程序（Vision Pro / Quest 等侧的 tracking 桥）按 docs/teleop.md 的
# JSON 协议向本机 UDP 端口发送手柄/头部位姿；操作端把双手位姿映射为
# Actions.end_effector_poses 下发。协议与坐标变换详见 docs/teleop.md。
#
#   操作端(局域网): cloudrobo r2c teleop --teleop-config config/teleop_vr_udp.yaml \
#       --endpoints tcp/<机器人IP>:7447
#   操作端(互联网): 换成 --bundle <平台证书zip>；相机画面走 LiveKit 推拉流。
#   无 VR 设备联调: python examples/vr_pose_mock_sender.py --port 9870
teleop:
  source:
    type: vr_udp
    config:
      listen_host: 0.0.0.0
      listen_port: 9870
      stale_after_s: 0.5        # 超时无数据判 stale，停发动作
      scale: 1.0                # VR 工作区 → 机器人工作区缩放
      workspace_offset: [0.0, 0.0, 0.0]   # 米，VR 原点在机器人基座系下的位置
      quat_order: xyzw          # 输入四元数顺序（内部统一为 x,y,z,w）
      # axis_remap:             # 机器人轴 ← 源轴+符号（含四元数同步变换）
      #   x: "+y"
      #   y: "-x"
      #   z: "+z"
      hands: [left, right]
      ee_name_map:              # 源键(手) → Actions.end_effector_poses 键
        left: left_ee
        right: right_ee
      gripper:
        source: grip            # grip（1=张开）| pinch（1=捏合，取 1-x）| none
        hand: right             # 用哪只手的捏合值作为夹爪开度

  action:
    mode: end_effector_pose
    action_hz: 30.0
    ee_pose_map:                # 源键(手) → 机器人末端名（与机器人配置对齐）
      left: left_ee
      right: right_ee
    gripper:
      emit: joint               # joint | end_effector_state | none
      joint_name: gripper
      range: [0.0, 100.0]       # 归一化开度 0~1 → 输出区间

  safety:
    require_observation: true
    observation_timeout_s: 2.0

  recording:
    enabled: true
    path: teleop_session.r2cr
